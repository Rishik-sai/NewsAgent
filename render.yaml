services:
  - type: web
    name: newsagent-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATABASE_URL
        fromDatabase:
          name: newsagent-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: "*" # You should restrict this to your Vercel URL later
      - key: JWT_SECRET
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false

databases:
  - name: newsagent-db
    databaseName: newsagent
    user: newsagent
    plan: free
